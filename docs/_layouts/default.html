<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "OMP Governance Scaffold" }}</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --good: #3fb950;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.68; }
    header { border-bottom: 1px solid var(--border); background: var(--surface); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 10; }
    nav { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center; justify-content: space-between; }
    nav .brand { font-weight: 700; color: var(--text); text-decoration: none; }
    nav .links { display: flex; flex-wrap: wrap; gap: 1rem; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    nav a:hover { color: var(--accent); }
    main { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    h2 { font-size: 1.45rem; margin-top: 2.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); margin-top: 1.5rem; }
    a { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface); }
    code { font-family: var(--mono); background: var(--surface); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.88em; }
    pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid var(--accent); margin: 1.25rem 0; padding: 0.5rem 1rem; background: var(--surface); color: var(--muted); }
    footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="index.html">OMP Governance Scaffold</a>
      <div class="links">
        <a href="architecture.html">Architecture &amp; Guts</a>
        <a href="compaction-sieve.html">Compaction Sieve</a>
        <a href="attractors.html">Attractors</a>
        <a href="projects.html">Projects</a>
        <a href="theory.html">Theory</a>
        <a href="influences.html">Influences</a>
      </div>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Published under the <a href="https://github.com/spoon-t8i/omp-governance-scaffold/blob/main/LICENSE">Apache License 2.0</a> &middot; <a href="https://github.com/spoon-t8i/omp-governance-scaffold">View Full Source on GitHub</a>
  </footer>
</body>
</html>
